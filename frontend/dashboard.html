<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>User Dashboard</title>

    <link
        rel="stylesheet"
        href="css/style.css"
    >

</head>

<body>

    <div class="container">

        <div class="card dashboard-card">

            <h1>Dashboard</h1>

            <p
                class="subtitle"
                id="welcomeMessage"
            >
                Loading profile...
            </p>

            <div
                id="verificationBanner"
                class="verification-banner hidden"
            >
                <div>
                    <strong>Action Required:</strong> Your email address is not verified yet.
                </div>
                <div style="display: flex; gap: 10px; align-items: center; flex-wrap: wrap;">
                    <button id="sendVerificationBtn" class="btn-secondary">
                        Send Verification Email
                    </button>
                    <span id="verificationStatus" class="verification-feedback"></span>
                </div>
            </div>

            <div
                class="profile"
                id="profile"
            >
                Loading...
            </div>

            <button id="logoutButton">
                Logout
            </button>

        </div>

    </div>

    <script type="module" src="js/app.js?v=2"></script>

</body>

</html>
