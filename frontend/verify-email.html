<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verify Your Email - Firebase Project</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <div class="container">
        <div class="card" style="text-align: center;">
            <div style="font-size: 48px; margin-bottom: 15px;">✉️</div>
            
            <h1>Verify Your Email</h1>
            
            <p class="subtitle" style="margin-bottom: 15px;">
                We sent a verification link to:
            </p>
            
            <p style="font-weight: 700; color: #1f2937; margin-bottom: 25px; word-break: break-all;" id="userEmailDisplay">
                Loading...
            </p>

            <div id="verifyAlert" class="verification-banner" style="text-align: left; margin-bottom: 20px;">
                <div>
                    Please check your inbox (and spam folder) and click the verification link to activate your account.
                </div>
            </div>

            <button id="checkVerificationBtn" style="margin-top: 10px; margin-bottom: 10px;">
                I've Verified My Email (Continue)
            </button>

            <button id="resendVerificationBtn" class="btn-secondary" style="width: 100%; margin-top: 5px;">
                Resend Verification Email
            </button>

            <p id="resendStatus" class="verification-feedback" style="margin-top: 12px; min-height: 20px;"></p>

            <p class="link-text" style="margin-top: 25px;">
                Wrong account? <a href="login.html" id="logoutFromVerify">Back to Login</a>
            </p>
        </div>
    </div>

    <script type="module" src="js/app.js?v=2"></script>
</body>
</html>
