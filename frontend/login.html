<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login - Firebase Project</title>

    <link rel="stylesheet" href="css/style.css">

</head>

<body>

    <div class="container">

        <div class="card">

            <h1>Welcome Back</h1>

            <p class="subtitle">
                Login to your account
            </p>

            <form id="loginForm">

                <label for="loginEmail">
                    Email
                </label>

                <input
                    type="email"
                    id="loginEmail"
                    placeholder="Enter your email"
                    required
                >

                <label for="loginPassword">
                    Password
                </label>

                <input
                    type="password"
                    id="loginPassword"
                    placeholder="Enter your password"
                    required
                >

                <button type="submit">
                    Login
                </button>
                

                <div class="divider">
                    <span>OR</span>
                </div>
                <button
                type="button"
                id="googleLoginButton"
                >
                Continue with Google
            </button>
            

            </form>

            <p id="loginMessage"></p>

            <p class="link-text">
                Don't have an account?
                <a href="signup.html">Create Account</a>
            </p>

        </div>

    </div>

    <script type="module" src="js/app.js"></script>

</body>
</html>
